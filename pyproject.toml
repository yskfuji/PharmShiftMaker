[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmshiftmaker"
version = "0.1.0"
description = "病院薬剤部の勤務計画・変更・監査を支援するシステム"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Yusuke Fujinami"}
]
keywords = ["shift", "scheduler", "hospital", "pharmacy", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings==2.15.0",
    "ortools==9.15.6755",
    "fastapi==0.141.1",
    "uvicorn[standard]>=0.27.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.8.2",
    "python-multipart==0.0.32",
    "httpx>=0.26.0",
    "itsdangerous>=2.1.2",
    "PyJWT[crypto]==2.15.0",
    "sqlalchemy>=2.0.29",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.17.2",
]

[project.optional-dependencies]
dev = [
    "black>=24.1.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
    "pyright>=1.1.407",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.105.0",
    "pre-commit>=3.6.0",
    "types-pyyaml>=6.0.12",
    "types-python-dateutil>=2.8.19",
    "alembic>=1.13.1",
]

[project.scripts]
pharmshiftmaker = "shift_scheduler.cli:main"
# 既存の利用者向けに従来名を互換入口として残す。
shift-scheduler = "shift_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["tools/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # Allow raising exceptions without from e
    # These enums predate StrEnum.  Changing their __str__ behaviour would be a
    # compatibility change for persisted/API values, so migrate them separately.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*.py" = ["ARG", "SIM117"]  # Nested contexts often assert __enter__ failures

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "ortools.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=shift_scheduler",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.setuptools.package-data]
"shift_scheduler.application" = ["copy_schema_inventory.json", "storage_routes.json"]
