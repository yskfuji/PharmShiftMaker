name: 改善提案
description: 利用場面と必要性を明らかにした改善を提案する
title: "[提案] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: safety
    attributes:
      label: 公開前の確認
      options:
        - label: 実在する職員、患者、施設担当者その他の本人情報を含めていない。
          required: true
        - label: 認証情報、秘密鍵、内部URL又は非公開の運用情報を含めていない。
          required: true
  - type: textarea
    id: use_case
    attributes:
      label: 利用場面
      description: 誰が、どの判断又は作業で困っているかを記載してください。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 必要な結果
      description: 特定の画面案ではなく、達成したい結果を記載してください。
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 誤操作、権限及び個人情報への影響
    validations:
      required: true
