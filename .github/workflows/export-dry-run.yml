name: Export Schedule Dry-Run

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  export-dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.15"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Verify that the CLI cannot bypass review and publication
        run: |
          set -euo pipefail
          ERROR_FILE="${RUNNER_TEMP}/export-error.txt"
          OUTPUT_DIR="${RUNNER_TEMP}/export-ci"
          set +e
          python scripts/export_schedule.py \
            --year 2025 \
            --month 2 \
            --generate \
            --output-dir "${OUTPUT_DIR}" \
            2>"${ERROR_FILE}"
          EXPORT_STATUS=$?
          set -e
          test "${EXPORT_STATUS}" -eq 1
          grep -F '生成・確認・公開を勤務表画面で完了してから出力してください。CLIから公開を迂回できません。' "${ERROR_FILE}"
          test ! -e "${OUTPUT_DIR}"
