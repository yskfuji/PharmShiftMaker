name: Export Schedule Dry-Run

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  export-dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Run export_schedule dry-run
        env:
          SHIFT_SCHEDULER_CONFIG_DIR: ${{ github.workspace }}/ops/demo_config
        run: |
          set -euo pipefail
          uvicorn shift_scheduler.api.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} && wait ${SERVER_PID} 2>/dev/null || true' EXIT
          sleep 5
          python scripts/export_schedule.py \
            --base-url http://127.0.0.1:8000 \
            --username leader \
            --password pass-lead \
            --year 2025 \
            --month 2 \
            --generate \
            --output-dir export-ci
          test -f export-ci/schedule_2025_02.json
          test -f export-ci/schedule_2025_02.csv
