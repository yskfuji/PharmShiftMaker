name: Export Schedule Dry-Run

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only an outdated pull-request run is cancelled; main and scheduled runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  export-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Verify that the CLI cannot bypass review and publication
        run: |
          set -euo pipefail
          ERROR_FILE="${RUNNER_TEMP}/export-error.txt"
          OUTPUT_DIR="${RUNNER_TEMP}/export-ci"
          set +e
          python scripts/export_schedule.py \
            --year 2025 \
            --month 2 \
            --generate \
            --output-dir "${OUTPUT_DIR}" \
            2>"${ERROR_FILE}"
          EXPORT_STATUS=$?
          set -e
          test "${EXPORT_STATUS}" -eq 1
          grep -F '生成・確認・公開を勤務表画面で完了してから出力してください。CLIから公開を迂回できません。' "${ERROR_FILE}"
          test ! -e "${OUTPUT_DIR}"
